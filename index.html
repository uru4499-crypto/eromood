<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EroMood - 今の気分で即診断</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; background: #111111; color: #f1f1f1; }
    .card { transition: all 0.25s ease; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 15px -3px rgb(0 0 0 / 0.3); }
    .tab { transition: all 0.2s; }
    .tab.active { background-color: #e11d48; color: white; }
    .chip { white-space: nowrap; }
    .source-btn { transition: all 0.2s; }
    .source-btn.active { background-color: #e11d48; color: white; }
  </style>
</head>
<body class="min-h-screen pb-20">
  <!-- 非固定ヘッダー -->
  <nav class="bg-zinc-950 py-5">
    <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
      <span class="text-3xl font-bold text-rose-500">EroMood</span>
      <div class="flex gap-4">
        <button onclick="showLoginModal()" class="px-5 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-full text-sm">ログイン</button>
        <button onclick="showLoginModal()" class="px-5 py-2 bg-rose-600 hover:bg-rose-500 rounded-full text-sm">登録</button>
      </div>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto px-6 py-8">
    <!-- モードタブ -->
    <div class="flex justify-center gap-2 mb-10 bg-zinc-900 p-1 rounded-3xl max-w-md mx-auto">
      <button onclick="switchTab(0)" class="tab active px-8 py-4 rounded-3xl text-base font-medium flex-1" id="tab0">検索診断</button>
      <button onclick="switchTab(1)" class="tab px-8 py-4 rounded-3xl text-base font-medium flex-1" id="tab1">タグ診断</button>
      <button onclick="switchTab(2)" class="tab px-8 py-4 rounded-3xl text-base font-medium flex-1" id="tab2">ランダム</button>
    </div>

    <!-- ソース選択（FANZA/MGS/DUGA/SOKMIL） -->
    <div class="flex justify-center gap-3 mb-8 flex-wrap" id="sourceSelector">
      <button onclick="setSource('fanza')" class="source-btn active px-6 py-3 rounded-full bg-zinc-800 text-sm font-medium" id="fanzaBtn">FANZA</button>
      <button onclick="setSource('mgs')" class="source-btn px-6 py-3 rounded-full bg-zinc-800 text-sm font-medium" id="mgsBtn">MGS</button>
      <button onclick="setSource('duga')" class="source-btn px-6 py-3 rounded-full bg-zinc-800 text-sm font-medium" id="dugaBtn">DUGA</button>
      <button onclick="setSource('sokmil')" class="source-btn px-6 py-3 rounded-full bg-zinc-800 text-sm font-medium" id="sokmilBtn">SOKMIL</button>
    </div>

    <!-- 検索診断 -->
    <div id="mode0" class="max-w-xl mx-auto">
      <input id="quickInput" type="text" placeholder="例：清楚巨乳で短めがいい" 
             class="w-full bg-zinc-900 border border-zinc-700 focus:border-rose-500 rounded-3xl px-6 py-5 text-lg outline-none">
      <button onclick="quickDiagnose()" 
              class="mt-6 w-full bg-rose-600 hover:bg-rose-500 py-6 rounded-3xl text-xl font-medium">今すぐ検索する</button>
    </div>

    <!-- タグ診断 -->
    <div id="mode1" class="hidden max-w-2xl mx-auto bg-zinc-900 rounded-3xl p-8">
      <div class="mb-8">
        <p class="font-medium mb-3">人種（複数OK）</p>
        <div class="flex flex-wrap gap-3">
          <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="race" value="日本人"> 日本人</label>
          <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="race" value="アジア系"> アジア系</label>
          <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="race" value="白人"> 白人</label>
          <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="race" value="黒人"> 黒人</label>
          <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="race" value="ラテン"> ラテン</label>
        </div>
      </div>
      <div>
        <p class="font-medium mb-3">ジャンル（複数OK）</p>
        <div class="flex flex-wrap gap-3">
          <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="清楚"> 清楚</label>
          <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="巨乳"> 巨乳</label>
          <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="素人"> 素人</label>
          <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="コスプレ"> コスプレ</label>
          <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="フェラ"> フェラ</label>
          <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="騎乗位"> 騎乗位</label>
          <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="熟女"> 熟女</label>
          <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="美少女"> 美少女</label>
          <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="VR"> VR</label>
          <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="ギャル"> ギャル</label>
          <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="制服"> 制服</label>
          <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="Lesbian"> Lesbian</label>
          <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="MILF"> MILF</label>
          <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="Teen"> Teen</label>
          <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="Anal"> Anal</label>
        </div>
      </div>
      <button onclick="fullDiagnose()" class="mt-8 w-full bg-rose-600 hover:bg-rose-500 py-6 rounded-3xl text-xl font-medium">このタグで診断する</button>
    </div>

    <!-- ランダム -->
    <div id="mode2" class="hidden text-center">
      <button onclick="randomPick()" 
              class="w-full max-w-md mx-auto bg-rose-600 hover:bg-rose-500 py-6 rounded-3xl text-xl font-medium">ランダムでおすすめする！</button>
    </div>

    <!-- 今すぐおすすめ -->
    <div class="mt-12">
      <h2 class="text-2xl font-medium mb-6">今すぐおすすめ</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="recommendGrid"></div>
    </div>

    <!-- 診断結果 -->
    <div id="resultArea" class="hidden mt-12">
      <h2 class="text-2xl font-medium mb-6">診断結果（5本）</h2>
      <div id="resultsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
    </div>

    <!-- 下の目立つヒーローテキスト -->
    <div class="mt-16 text-center">
      <h2 class="hero-text text-4xl font-semibold tracking-tight mb-3">今の気分で、<span class="text-rose-400">最高の1本</span>を。</h2>
      <p class="text-lg text-zinc-400">AIがFANZAとPornhubから、ぴったりな動画を秒で見つけてくれます</p>
    </div>
  </div>

  <footer class="bg-zinc-950 py-8 text-center text-xs text-zinc-500 border-t border-zinc-800">
    18歳未満禁止｜アフィリエイトリンクを使用｜責任は自己負担｜© 2026 EroMood
  </footer>

  <!-- ログイン・登録モーダル -->
  <div id="loginModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
    <div class="bg-zinc-900 rounded-3xl p-8 max-w-sm w-full mx-4">
      <h3 class="text-2xl font-bold mb-6 text-center">ログイン / 登録</h3>
      <input id="email" type="email" placeholder="メールアドレス" class="w-full bg-zinc-800 rounded-2xl px-6 py-4 mb-4">
      <input id="password" type="password" placeholder="パスワード" class="w-full bg-zinc-800 rounded-2xl px-6 py-4 mb-6">
      <button onclick="loginSuccess()" class="w-full bg-rose-600 hover:bg-rose-500 py-5 rounded-3xl text-xl font-medium">ログインする</button>
      <button onclick="closeModal()" class="mt-4 w-full text-zinc-400">キャンセル</button>
    </div>
  </div>

  <script>
    let currentSource = "fanza";

    function setSource(src) {
      currentSource = src;
      document.querySelectorAll('.source-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(src + 'Btn').classList.add('active');
      initRecommend();
    }

    function showLoginModal() {
      document.getElementById('loginModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('loginModal').classList.add('hidden');
    }

    function loginSuccess() {
      closeModal();
      alert("✅ ログインしました！\nAIがあなたの好みを学習します。\nこれからおすすめがどんどん精度アップします！");
    }

    const sampleVideosFANZA = [
      {title: "清楚系JAV 12分絶頂", duration: "12:34", source: "FANZA"},
      {title: "素人巨乳フェラ特化", duration: "08:45", source: "FANZA"}
    ];

    const sampleVideosMGS = [
      {title: "プレステージ新作 騎乗位", duration: "15:22", source: "MGS"},
      {title: "MGS独占 美少女", duration: "20:11", source: "MGS"}
    ];

    const sampleVideosDUGA = [
      {title: "DUGA SOD新作", duration: "18:45", source: "DUGA"},
      {title: "DUGA 熟女シリーズ", duration: "25:03", source: "DUGA"}
    ];

    const sampleVideosSOKMIL = [
      {title: "SOKMIL 月額見放題", duration: "22:30", source: "SOKMIL"},
      {title: "SOKMIL 無修正以外", duration: "14:55", source: "SOKMIL"}
    ];

    function createCard(v) {
      return `
        <div class="card bg-zinc-900 rounded-3xl overflow-hidden">
          <div class="relative aspect-video">
            <img src="https://picsum.photos/id/${Math.floor(Math.random()*100)+10}/640/360" class="w-full h-full object-cover" alt="">
            <div class="absolute bottom-3 right-3 bg-black/70 text-xs px-2 py-0.5 rounded">${v.duration}</div>
          </div>
          <div class="p-4">
            <div class="text-rose-400 text-xs mb-1">${v.source}</div>
            <h3 class="font-medium text-base leading-tight">${v.title}</h3>
            <p class="text-zinc-400 text-sm mt-2">Grok診断: この気分に超ドンピシャ</p>
            <a href="#" target="_blank" class="mt-4 block text-center bg-zinc-800 hover:bg-rose-600 py-3 rounded-2xl text-sm font-medium transition-colors">今すぐ見る</a>
          </div>
        </div>`;
    }

    function initRecommend() {
      const grid = document.getElementById('recommendGrid');
      let videos = [];
      if (currentSource === "fanza") videos = sampleVideosFANZA;
      else if (currentSource === "mgs") videos = sampleVideosMGS;
      else if (currentSource === "duga") videos = sampleVideosDUGA;
      else if (currentSource === "sokmil") videos = sampleVideosSOKMIL;
      grid.innerHTML = videos.map(v => createCard(v)).join('');
    }

    function showResults(videos) {
      const area = document.getElementById('resultArea');
      const grid = document.getElementById('resultsGrid');
      grid.innerHTML = videos.map(v => createCard(v)).join('');
      area.classList.remove('hidden');
      area.scrollIntoView({behavior: "smooth"});
    }

    function quickDiagnose() {
      let videos = [];
      if (currentSource === "fanza") videos = sampleVideosFANZA;
      else if (currentSource === "mgs") videos = sampleVideosMGS;
      else if (currentSource === "duga") videos = sampleVideosDUGA;
      else if (currentSource === "sokmil") videos = sampleVideosSOKMIL;
      const shuffled = [...videos].sort(() => Math.random() - 0.5);
      showResults(shuffled.slice(0,5));
    }

    function fullDiagnose() {
      let videos = [];
      if (currentSource === "fanza") videos = sampleVideosFANZA;
      else if (currentSource === "mgs") videos = sampleVideosMGS;
      else if (currentSource === "duga") videos = sampleVideosDUGA;
      else if (currentSource === "sokmil") videos = sampleVideosSOKMIL;
      const shuffled = [...videos].sort(() => Math.random() - 0.5);
      showResults(shuffled.slice(0,5));
    }

    function randomPick() {
      let videos = [];
      if (currentSource === "fanza") videos = sampleVideosFANZA;
      else if (currentSource === "mgs") videos = sampleVideosMGS;
      else if (currentSource === "duga") videos = sampleVideosDUGA;
      else if (currentSource === "sokmil") videos = sampleVideosSOKMIL;
      const shuffled = [...videos].sort(() => Math.random() - 0.5);
      showResults(shuffled.slice(0,5));
    }

    function switchTab(n) {
      document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === n));
      document.getElementById('mode0').classList.toggle('hidden', n !== 0);
      document.getElementById('mode1').classList.toggle('hidden', n !== 1);
      document.getElementById('mode2').classList.toggle('hidden', n !== 2);
    }

    // 起動
    initRecommend();
    switchTab(0);
  </script>
</body>
</html>
