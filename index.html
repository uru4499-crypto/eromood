<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EroMood - 今の気分で即診断</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; background: #111111; color: #f1f1f1; }
    .card { transition: all 0.25s ease; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 15px -3px rgb(0 0 0 / 0.3); }
    .tab { transition: all 0.2s; }
    .tab.active { background-color: #e11d48; color: white; }
    .source-btn { transition: all 0.2s; }
    .source-btn.active { background-color: #e11d48; color: white; }
    .nav-btn { transition: all 0.2s; }
    .nav-btn.active { background-color: #e11d48; color: white; }
  </style>
</head>
<body class="min-h-screen pb-20">

  <!-- ヘッダー -->
  <nav class="bg-zinc-950 py-4 border-b border-zinc-800">
    <div class="max-w-6xl mx-auto px-6 flex items-center justify-between">
      <span class="text-3xl font-bold text-rose-500">EroMood</span>
      <button onclick="switchPage(1)" class="px-6 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-full text-sm font-medium">使い方</button>
    </div>
  </nav>

  <!-- ヘッダー直下ナビバー -->
  <div class="bg-zinc-900 py-3 border-b border-zinc-800">
    <div class="max-w-6xl mx-auto px-6 flex gap-2 overflow-x-auto pb-1">
      <button onclick="switchPage(0)" class="nav-btn active px-7 py-3 rounded-3xl text-sm font-medium whitespace-nowrap" id="nav0">診断</button>
      <button onclick="switchPage(3)" class="nav-btn px-7 py-3 rounded-3xl text-sm font-medium whitespace-nowrap" id="nav3">おすすめ</button>
      <button onclick="switchPage(4)" class="nav-btn px-7 py-3 rounded-3xl text-sm font-medium whitespace-nowrap" id="nav4">WebMループ</button>
      <button onclick="switchPage(2)" class="nav-btn px-7 py-3 rounded-3xl text-sm font-medium whitespace-nowrap" id="nav2">ランキング</button>
    </div>
  </div>

  <div class="max-w-6xl mx-auto px-6 py-8">

    <!-- 診断ページ -->
    <div id="page0">
      <!-- モードタブ -->
      <div class="flex justify-center gap-2 mb-10 bg-zinc-900 p-1 rounded-3xl max-w-md mx-auto">
        <button onclick="switchTab(0)" class="tab active px-8 py-4 rounded-3xl text-base font-medium flex-1" id="tab0">検索診断</button>
        <button onclick="switchTab(1)" class="tab px-8 py-4 rounded-3xl text-base font-medium flex-1" id="tab1">タグ診断</button>
        <button onclick="switchTab(2)" class="tab px-8 py-4 rounded-3xl text-base font-medium flex-1" id="tab2">ランダム</button>
      </div>

      <!-- ソース選択 -->
      <div class="flex justify-center gap-3 mb-8 flex-wrap" id="sourceSelector">
        <button onclick="setSource('fanza')" class="source-btn active px-6 py-3 rounded-full bg-zinc-800 text-sm font-medium" id="fanzaBtn">FANZA</button>
        <button onclick="setSource('mgs')" class="source-btn px-6 py-3 rounded-full bg-zinc-800 text-sm font-medium" id="mgsBtn">MGS</button>
        <button onclick="setSource('duga')" class="source-btn px-6 py-3 rounded-full bg-zinc-800 text-sm font-medium" id="dugaBtn">DUGA</button>
        <button onclick="setSource('sokmil')" class="source-btn px-6 py-3 rounded-full bg-zinc-800 text-sm font-medium" id="sokmilBtn">SOKMIL</button>
      </div>

      <!-- 検索診断 -->
      <div id="mode0" class="max-w-xl mx-auto">
        <input id="quickInput" type="text" placeholder="例：清楚巨乳で短めがいい" class="w-full bg-zinc-900 border border-zinc-700 focus:border-rose-500 rounded-3xl px-6 py-5 text-lg outline-none">
        <button onclick="quickDiagnose()" class="mt-6 w-full bg-rose-600 hover:bg-rose-500 py-6 rounded-3xl text-xl font-medium">今すぐ検索する</button>
      </div>

      <!-- タグ診断（完全版） -->
      <div id="mode1" class="hidden max-w-2xl mx-auto bg-zinc-900 rounded-3xl p-8">
        <!-- 人種・ジャンル選択（省略せず完全版） -->
        <div class="mb-8">
          <p class="font-medium mb-3">人種（複数OK）</p>
          <div class="flex flex-wrap gap-3">
            <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="race" value="日本人"> 日本人</label>
            <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="race" value="アジア系"> アジア系</label>
            <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="race" value="白人"> 白人</label>
            <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="race" value="黒人"> 黒人</label>
            <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="race" value="ラテン"> ラテン</label>
          </div>
        </div>
        <div>
          <p class="font-medium mb-3">ジャンル（複数OK）</p>
          <div class="flex flex-wrap gap-3">
            <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="清楚"> 清楚</label>
            <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="巨乳"> 巨乳</label>
            <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="素人"> 素人</label>
            <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="コスプレ"> コスプレ</label>
            <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="フェラ"> フェラ</label>
            <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="騎乗位"> 騎乗位</label>
            <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="熟女"> 熟女</label>
            <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="美少女"> 美少女</label>
            <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="VR"> VR</label>
            <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="ギャル"> ギャル</label>
            <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="制服"> 制服</label>
            <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="Lesbian"> Lesbian</label>
            <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="MILF"> MILF</label>
            <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="Teen"> Teen</label>
            <label class="chip flex items-center gap-2 bg-zinc-800 px-5 py-2 rounded-full"><input type="checkbox" class="genre" value="Anal"> Anal</label>
          </div>
        </div>
        <button onclick="fullDiagnose()" class="mt-8 w-full bg-rose-600 hover:bg-rose-500 py-6 rounded-3xl text-xl font-medium">このタグで診断する</button>
      </div>

      <!-- ランダム -->
      <div id="mode2" class="hidden text-center">
        <button onclick="randomPick()" class="w-full max-w-md mx-auto bg-rose-600 hover:bg-rose-500 py-6 rounded-3xl text-xl font-medium">ランダムでおすすめする！</button>
      </div>

      <!-- 今すぐおすすめ -->
      <div class="mt-12">
        <h2 class="text-2xl font-medium mb-6">今すぐおすすめ</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="recommendGrid"></div>
      </div>

      <!-- 診断結果 -->
      <div id="resultArea" class="hidden mt-12">
        <h2 class="text-2xl font-medium mb-6">診断結果（5本）</h2>
        <div id="resultsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
      </div>
    </div>

    <!-- 使い方ページ -->
    <div id="page1" class="hidden max-w-2xl mx-auto bg-zinc-900 rounded-3xl p-10">
      <h1 class="text-3xl font-bold mb-6">EroMoodの使い方</h1>
      <p class="text-lg leading-relaxed">EroMoodはAIがあなたの今の気分にぴったり合う日本のAVを秒で見つけてくれる無料診断サイトです。</p>
      <p class="text-lg leading-relaxed mt-4">1. ソースを選択<br>2. 検索診断・タグ診断・ランダムから選ぶ<br>3. 気に入った作品は「保存」ボタンで後で見られます</p>
    </div>

    <!-- ランキングページ -->
    <div id="page2" class="hidden max-w-2xl mx-auto bg-zinc-900 rounded-3xl p-10">
      <h1 class="text-3xl font-bold mb-6">人気AVランキング</h1>
      <div class="flex gap-2 mb-8 bg-zinc-800 p-1 rounded-3xl">
        <button onclick="switchRankTab(0)" class="rank-tab active flex-1 py-3 rounded-3xl text-sm" id="rank0">今月</button>
        <button onclick="switchRankTab(1)" class="rank-tab flex-1 py-3 rounded-3xl text-sm" id="rank1">今週</button>
        <button onclick="switchRankTab(2)" class="rank-tab flex-1 py-3 rounded-3xl text-sm" id="rank2">今年</button>
      </div>
      <p class="text-lg leading-relaxed">2026年4月現在、FANZA・MGS・DUGA・SOKMILで特に人気の作品です。</p>
    </div>

    <!-- WebMループページ -->
    <div id="page4" class="hidden max-w-6xl mx-auto">
      <h2 class="text-2xl font-medium mb-6">WebMループおすすめ</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="webmGrid"></div>
    </div>
  </div>

  <footer class="bg-zinc-950 py-8 text-center text-xs text-zinc-500 border-t border-zinc-800">
    18歳未満禁止｜アフィリエイトリンクを使用｜責任は自己負担｜© 2026 EroMood
  </footer>

  <!-- ログイン・登録モーダル -->
  <div id="loginModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
    <div class="bg-zinc-900 rounded-3xl p-8 max-w-sm w-full mx-4">
      <h3 class="text-2xl font-bold mb-6 text-center">ログイン / 登録</h3>
      <input id="email" type="email" placeholder="メールアドレス" class="w-full bg-zinc-800 rounded-2xl px-6 py-4 mb-4">
      <input id="password" type="password" placeholder="パスワード" class="w-full bg-zinc-800 rounded-2xl px-6 py-4 mb-6">
      <button onclick="loginSuccess()" class="w-full bg-rose-600 hover:bg-rose-500 py-5 rounded-3xl text-xl font-medium">ログインする</button>
      <button onclick="closeModal()" class="mt-4 w-full text-zinc-400">キャンセル</button>
    </div>
  </div>

  <script>
    let currentSource = "fanza";

    function setSource(src) {
      currentSource = src;
      document.querySelectorAll('.source-btn').forEach(btn => btn.classList.remove('active'));
      const btn = document.getElementById(src + 'Btn');
      if (btn) btn.classList.add('active');
      initRecommend();
    }

    function showLoginModal() {
      document.getElementById('loginModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('loginModal').classList.add('hidden');
    }

    function loginSuccess() {
      closeModal();
      alert("ログインしました！ AIがあなたの好みを学習します。");
    }

    const sampleVideosFANZA = [{title: "清楚系JAV 12分絶頂", duration: "12:34", source: "FANZA"},{title: "素人巨乳フェラ特化", duration: "08:45", source: "FANZA"},{title: "美少女VR体験", duration: "20:11", source: "FANZA"},{title: "騎乗位熟女", duration: "15:22", source: "FANZA"},{title: "ギャル制服", duration: "18:45", source: "FANZA"}];
    const sampleVideosMGS = [{title: "プレステージ新作 騎乗位", duration: "15:22", source: "MGS"},{title: "MGS独占 美少女", duration: "20:11", source: "MGS"},{title: "MGS 清楚系", duration: "12:34", source: "MGS"},{title: "MGS 巨乳シリーズ", duration: "25:03", source: "MGS"},{title: "MGS 素人", duration: "14:55", source: "MGS"}];
    const sampleVideosDUGA = [{title: "DUGA SOD新作", duration: "18:45", source: "DUGA"},{title: "DUGA 熟女シリーズ", duration: "25:03", source: "DUGA"},{title: "DUGA 美少女", duration: "12:34", source: "DUGA"},{title: "DUGA VR", duration: "20:11", source: "DUGA"},{title: "DUGA ギャル", duration: "15:22", source: "DUGA"}];
    const sampleVideosSOKMIL = [{title: "SOKMIL 月額見放題", duration: "22:30", source: "SOKMIL"},{title: "SOKMIL 無修正以外", duration: "14:55", source: "SOKMIL"},{title: "SOKMIL 清楚", duration: "18:45", source: "SOKMIL"},{title: "SOKMIL 巨乳", duration: "12:34", source: "SOKMIL"},{title: "SOKMIL 熟女", duration: "20:11", source: "SOKMIL"}];

    function createCard(v, isWebM = false) {
      const media = isWebM ? `<video class="w-full h-full object-cover" autoplay loop muted playsinline><source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny_320x240_10s_1MB.mp4" type="video/mp4"></video>` : `<img src="https://picsum.photos/id/${Math.floor(Math.random()*100)+10}/640/360" class="w-full h-full object-cover" alt="">`;
      return `<div class="card bg-zinc-900 rounded-3xl overflow-hidden"><div class="relative aspect-video">${media}</div><div class="p-4"><div class="text-rose-400 text-xs mb-1">${v.source}</div><h3 class="font-medium text-base leading-tight">${v.title}</h3><p class="text-zinc-400 text-sm mt-2">Grok診断: この気分に超ドンピシャ</p><div class="flex gap-3 mt-4"><a href="#" target="_blank" class="flex-1 text-center bg-zinc-800 hover:bg-rose-600 py-3 rounded-2xl text-sm font-medium transition-colors">今すぐ見る</a><button onclick="saveVideo('${v.title}')" class="px-6 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-2xl text-sm font-medium">保存</button></div></div></div>`;
    }

    function initRecommend() {
      const grid = document.getElementById('recommendGrid');
      if (!grid) return;
      let videos = [];
      if (currentSource === "fanza") videos = sampleVideosFANZA;
      else if (currentSource === "mgs") videos = sampleVideosMGS;
      else if (currentSource === "duga") videos = sampleVideosDUGA;
      else if (currentSource === "sokmil") videos = sampleVideosSOKMIL;
      grid.innerHTML = videos.map(v => createCard(v)).join('');
    }

    function initWebMGrid() {
      const grid = document.getElementById('webmGrid');
      if (!grid) return;
      let videos = sampleVideosFANZA.concat(sampleVideosMGS, sampleVideosDUGA, sampleVideosSOKMIL);
      grid.innerHTML = videos.map(v => createCard(v, true)).join('');
    }

    function showResults(videos) {
      const area = document.getElementById('resultArea');
      const grid = document.getElementById('resultsGrid');
      if (!grid) return;
      grid.innerHTML = videos.map(v => createCard(v)).join('');
      if (area) {
        area.classList.remove('hidden');
        area.scrollIntoView({behavior: "smooth"});
      }
    }

    function quickDiagnose() {
      let videos = [];
      if (currentSource === "fanza") videos = sampleVideosFANZA;
      else if (currentSource === "mgs") videos = sampleVideosMGS;
      else if (currentSource === "duga") videos = sampleVideosDUGA;
      else if (currentSource === "sokmil") videos = sampleVideosSOKMIL;
      const shuffled = [...videos].sort(() => Math.random() - 0.5);
      showResults(shuffled);
    }

    function fullDiagnose() {
      let videos = [];
      if (currentSource === "fanza") videos = sampleVideosFANZA;
      else if (currentSource === "mgs") videos = sampleVideosMGS;
      else if (currentSource === "duga") videos = sampleVideosDUGA;
      else if (currentSource === "sokmil") videos = sampleVideosSOKMIL;
      const shuffled = [...videos].sort(() => Math.random() - 0.5);
      showResults(shuffled);
    }

    function randomPick() {
      let videos = [];
      if (currentSource === "fanza") videos = sampleVideosFANZA;
      else if (currentSource === "mgs") videos = sampleVideosMGS;
      else if (currentSource === "duga") videos = sampleVideosDUGA;
      else if (currentSource === "sokmil") videos = sampleVideosSOKMIL;
      const shuffled = [...videos].sort(() => Math.random() - 0.5);
      showResults(shuffled);
    }

    function saveVideo(title) {
      alert(title + " を保存しました");
    }

    function switchTab(n) {
      document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === n));
      document.getElementById('mode0').classList.toggle('hidden', n !== 0);
      document.getElementById('mode1').classList.toggle('hidden', n !== 1);
      document.getElementById('mode2').classList.toggle('hidden', n !== 2);
    }

    function switchPage(n) {
      // すべてのページを非表示
      document.querySelectorAll('#page0, #page1, #page2, #page4').forEach(p => p.classList.add('hidden'));
      // 対象ページを表示
      const target = document.getElementById('page' + n);
      if (target) target.classList.remove('hidden');

      // ナビバーのactive状態を正しく更新
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('nav' + n);
      if (activeBtn) activeBtn.classList.add('active');

      if (n === 4) initWebMGrid();
    }

    function switchRankTab(n) {
      document.querySelectorAll('.rank-tab').forEach((t, i) => t.classList.toggle('active', i === n));
    }

    // 起動
    initRecommend();
    switchTab(0);
    switchPage(0);
  </script>
</body>
</html>
