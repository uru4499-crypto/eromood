<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EroMood - 今の気分で即診断</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; background: #111111; color: #f1f1f1; }
    .logo { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
    .card { transition: all 0.25s ease; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 15px -3px rgb(0 0 0 / 0.3); }
    .tab { transition: all 0.2s; }
    .tab.active { background-color: #e11d48; color: white; }
  </style>
</head>
<body class="min-h-screen pb-20">
  <!-- ナビ -->
  <nav class="bg-zinc-950 border-b border-zinc-800 py-5 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
      <span class="logo text-rose-500">EroMood</span>
      <div class="flex gap-8 text-sm font-medium">
        <a href="#" class="hover:text-rose-400">診断</a>
        <a href="#" class="hover:text-rose-400">おすすめ</a>
        <a href="#" class="hover:text-rose-400">履歴</a>
      </div>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto px-6 py-10">
    <!-- ヒーロー -->
    <div class="text-center mb-12">
      <h1 class="text-5xl font-semibold tracking-tight mb-3">今の気分で、<span class="text-rose-400">最高の1本</span>を。</h1>
      <p class="text-xl text-zinc-400">AIがFANZAとPornhubから、あなたにぴったりな動画を秒で見つけてくれます</p>
    </div>

    <!-- モードタブ -->
    <div class="flex justify-center gap-2 mb-10 bg-zinc-900 p-1 rounded-3xl max-w-md mx-auto">
      <button onclick="switchTab(0)" class="tab active px-8 py-3 rounded-3xl text-base font-medium flex-1" id="tab0">クイック診断</button>
      <button onclick="switchTab(1)" class="tab px-8 py-3 rounded-3xl text-base font-medium flex-1" id="tab1">詳細診断</button>
      <button onclick="switchTab(2)" class="tab px-8 py-3 rounded-3xl text-base font-medium flex-1" id="tab2">ランダム</button>
    </div>

    <!-- クイック診断 -->
    <div id="mode0" class="max-w-xl mx-auto">
      <input id="quickInput" type="text" placeholder="例：清楚巨乳で短めがいい" 
             class="w-full bg-zinc-900 border border-zinc-700 focus:border-rose-500 rounded-3xl px-6 py-5 text-lg outline-none">
      <button onclick="quickDiagnose()" 
              class="mt-6 w-full bg-rose-600 hover:bg-rose-500 py-5 rounded-3xl text-xl font-medium">今すぐ診断する</button>
    </div>

    <!-- 詳細診断（タグ大幅増強） -->
    <div id="mode1" class="hidden max-w-2xl mx-auto bg-zinc-900 rounded-3xl p-8">
      <div class="grid grid-cols-2 gap-8 text-sm">
        <!-- 人種 -->
        <div>
          <p class="font-medium mb-3">人種（複数OK）</p>
          <div class="space-y-2">
            <label class="flex items-center gap-2"><input type="checkbox" class="race" value="日本人"> 日本人/アジア</label>
            <label class="flex items-center gap-2"><input type="checkbox" class="race" value="白人"> 白人</label>
            <label class="flex items-center gap-2"><input type="checkbox" class="race" value="黒人"> 黒人</label>
            <label class="flex items-center gap-2"><input type="checkbox" class="race" value="ラテン"> ラテン</label>
          </div>
        </div>
        <!-- ジャンル（FANZA/PH人気タグ逆輸入で15個以上に） -->
        <div>
          <p class="font-medium mb-3">ジャンル（複数OK）</p>
          <div class="grid grid-cols-2 gap-2">
            <label class="flex items-center gap-2"><input type="checkbox" class="genre" value="清楚"> 清楚</label>
            <label class="flex items-center gap-2"><input type="checkbox" class="genre" value="巨乳"> 巨乳</label>
            <label class="flex items-center gap-2"><input type="checkbox" class="genre" value="素人"> 素人</label>
            <label class="flex items-center gap-2"><input type="checkbox" class="genre" value="コスプレ"> コスプレ</label>
            <label class="flex items-center gap-2"><input type="checkbox" class="genre" value="フェラ"> フェラ特化</label>
            <label class="flex items-center gap-2"><input type="checkbox" class="genre" value="騎乗位"> 騎乗位</label>
            <label class="flex items-center gap-2"><input type="checkbox" class="genre" value="熟女"> 熟女</label>
            <label class="flex items-center gap-2"><input type="checkbox" class="genre" value="美少女"> 美少女</label>
            <label class="flex items-center gap-2"><input type="checkbox" class="genre" value="VR"> VR</label>
            <label class="flex items-center gap-2"><input type="checkbox" class="genre" value="ギャル"> ギャル</label>
            <label class="flex items-center gap-2"><input type="checkbox" class="genre" value="制服"> 制服</label>
            <label class="flex items-center gap-2"><input type="checkbox" class="genre" value="Lesbian"> Lesbian</label>
            <label class="flex items-center gap-2"><input type="checkbox" class="genre" value="MILF"> MILF</label>
            <label class="flex items-center gap-2"><input type="checkbox" class="genre" value="Teen"> Teen</label>
            <label class="flex items-center gap-2"><input type="checkbox" class="genre" value="Anal"> Anal</label>
          </div>
        </div>
      </div>
      <button onclick="fullDiagnose()" class="mt-8 w-full bg-rose-600 hover:bg-rose-500 py-5 rounded-3xl text-xl font-medium">この条件で診断する</button>
    </div>

    <!-- ランダム -->
    <div id="mode2" class="hidden text-center">
      <button onclick="randomPick()" 
              class="w-full max-w-md mx-auto bg-rose-600 hover:bg-rose-500 py-5 rounded-3xl text-xl font-medium">ランダムでおすすめする！</button>
    </div>

    <!-- 常時おすすめ -->
    <div class="mt-16">
      <h2 class="text-2xl font-medium mb-6">今すぐおすすめ</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="recommendGrid"></div>
    </div>

    <!-- 診断結果エリア -->
    <div id="resultArea" class="hidden mt-16">
      <h2 class="text-2xl font-medium mb-6">診断結果（5本）</h2>
      <div id="resultsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
    </div>
  </div>

  <footer class="bg-zinc-950 py-8 text-center text-xs text-zinc-500 border-t border-zinc-800">
    18歳未満禁止｜アフィリエイトリンクを使用｜責任は自己負担｜© 2026 EroMood
  </footer>

  <script>
    // ※ここは仮データ（後でDMM/Pornhub APIで本物のタイトル・サムネ・embedに自動置き換え）
    const sampleVideos = [
      {title: "清楚系JAV 12分絶頂", duration: "12:34", source: "FANZA"},
      {title: "白人美女騎乗位狂い", duration: "18:22", source: "Pornhub"},
      {title: "素人巨乳フェラ特化", duration: "08:45", source: "FANZA"},
      {title: "黒人アスリートハード", duration: "25:11", source: "Pornhub"},
      {title: "コスプレ美少女 騎乗位", duration: "15:03", source: "Pornhub"},
      {title: "熟女清楚系 20分絶頂", duration: "22:47", source: "FANZA"}
    ];

    function createCard(v) {
      return `
        <div class="card bg-zinc-900 rounded-3xl overflow-hidden">
          <div class="relative">
            <img src="https://picsum.photos/id/${Math.floor(Math.random()*100)+10}/320/180" class="w-full h-auto" alt="">
            <div class="absolute bottom-3 right-3 bg-black/70 text-xs px-2 py-0.5 rounded">${v.duration}</div>
          </div>
          <div class="p-4">
            <div class="text-rose-400 text-xs mb-1">${v.source}</div>
            <h3 class="font-medium text-base leading-tight">${v.title}</h3>
            <p class="text-zinc-400 text-sm mt-2">Grok診断: この気分に超ドンピシャ</p>
            <a href="#" target="_blank" class="mt-4 block text-center bg-zinc-800 hover:bg-rose-600 py-3 rounded-2xl text-sm font-medium transition-colors">今すぐ見る</a>
          </div>
        </div>`;
    }

    function initRecommend() {
      const grid = document.getElementById('recommendGrid');
      grid.innerHTML = sampleVideos.map(v => createCard(v)).join('');
    }

    function showResults(videos) {
      const area = document.getElementById('resultArea');
      const grid = document.getElementById('resultsGrid');
      grid.innerHTML = videos.map(v => createCard(v)).join('');
      area.classList.remove('hidden');
      area.scrollIntoView({behavior: "smooth"});
    }

    function quickDiagnose() {
      const shuffled = [...sampleVideos].sort(() => Math.random() - 0.5);
      showResults(shuffled.slice(0, 5));
    }

    function fullDiagnose() {
      const shuffled = [...sampleVideos].sort(() => Math.random() - 0.5);
      showResults(shuffled.slice(0, 5));
    }

    function randomPick() {
      const shuffled = [...sampleVideos].sort(() => Math.random() - 0.5);
      showResults(shuffled.slice(0, 5));
    }

    function switchTab(n) {
      document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === n));
      document.getElementById('mode0').classList.toggle('hidden', n !== 0);
      document.getElementById('mode1').classList.toggle('hidden', n !== 1);
      document.getElementById('mode2').classList.toggle('hidden', n !== 2);
    }

    // 起動
    initRecommend();
    switchTab(0);
  </script>
</body>
</html>
